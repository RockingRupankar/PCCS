[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icc-clustering"
version = "0.1.0"
description = "Cluster stability-based ensemble learning for noisy high-dimensional data: PCCS, ICC and reproducible experiment suites"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["clustering", "consensus clustering", "cluster stability", "ensemble learning", "high-dimensional data"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "experiments"]
addopts = "-q"
