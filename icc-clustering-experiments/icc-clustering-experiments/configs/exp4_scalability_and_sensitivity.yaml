experiment: exp4_scalability_and_sensitivity
scalability:
  generator: gaussian_mixture
  n_sweep: {values: [250, 500, 1000, 1500, 2000], d: 100}
  d_sweep: {values: [20, 50, 100, 200, 400], n: 800}
  icc_overrides: {n_views: 12}
  repetitions: 2
sensitivity:
  data: {generator: pccs, profile: noisy, n_samples: 800, generator_seeds: [42, 43, 44]}
  grid:
    n_views: [4, 8, 12, 20, 32]
    row_frac: [0.5, 0.6, 0.7, 0.8, 0.9]
    feat_frac: [0.2, 0.35, 0.5, 0.7, 0.9]
    noise_sd: [0.0, 0.1, 0.25, 0.5, 1.0]
    weight_power: [0.0, 1.0, 2.0, 4.0]
    invariance_lambda: [0.0, 0.25, 0.5, 0.75, 1.0]
    n_clusters_assumed: [3, 4, 5, 6, 8]
