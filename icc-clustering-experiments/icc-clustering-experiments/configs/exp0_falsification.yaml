# Settings used for the released exp0 results. Documentation only: the authoritative constants live in
# experiments/exp0_falsification/src/exp0_core.py and the exp0_*.py runners.
experiment: exp0_falsification
hypothesis: "K-means stability separates structured data from structure-free data"
decision_rule: {gap_threshold: 0.10, gap: "stability(structured) - max(stability(null_iso), stability(null_aniso))"}
data: {n: 400, d: 20, informative_dims: 5, clusters: 4, separation: 11.0}
stability: {algorithm: kmeans, k: 4, runs_per_estimate: 8, subsample_fraction: 0.8}
main_sweep: {noise_levels: [0, 0.25, 0.5, 1.0, 1.5, 2.0, 3.0], seeds: 20}
finegrid: {noise_levels: "linspace(0, 3, 25)", seeds: 10}
noise_types: {types: [gaussian, student_t3, outliers, missing_imputed, feature_shuffle, uniform], levels: [0.5, 1.0, 2.0], seeds: 10}
scaled: {n: 600, dimensions: [20, 50, 100, 200, 400], noise_levels: [0.5, 1.0], seeds: 8}
fcm: {dimensions: [10, 50, 200], noise_levels: [0.0, 1.0], fuzzifier_m: [1.05, 1.1, 1.25, 1.5, 1.75, 2.0, 2.5, 3.0, 4.0, 6.0, 10.0], seeds: 8}
