# Configuration for Heterogeneous Clustering Ensemble
clustering:
  methods:
    - "kmeans"
    - "fcm"
    - "dbscan"
    - "hierarchical"
  kmeans:
    n_init: 10
    max_iter: 300
    jitter_seeds: true
  fcm:
    fuzzifier: 1.3
    max_iter: 150
    tol: 1e-4
  dbscan:
    min_samples: 5
    eps_quantile: 0.6
    eps_scale: 1.2
    noise_handling: "explicit_non_coassociating"
  hierarchical:
    linkage: "ward"
    metric: "euclidean"
    alternative_linkages: ["average", "complete"]
